<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Jensen Huang and Michael Jordan were both born on 17 February 1963" font-family="Arial, Helvetica, sans-serif">
<rect width="760" height="270" fill="#F2EDE3"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#0E0D0B">Same day, same year</text>
<text x="380" y="114" text-anchor="middle" font-size="54" font-weight="700" fill="#0E0D0B">17.02.1963</text>
<rect x="290" y="130" width="180" height="4" fill="#1E3BFF"/>
<line x1="120" x2="640" y1="154" y2="154" stroke="#D6D0C4"/>
<g text-anchor="middle">
<text x="220" y="190" font-size="17" font-weight="700" fill="#0E0D0B">Jensen Huang</text>
<text x="220" y="210" font-size="12" fill="#5E584E">Tainan, Taiwan</text>
<text x="220" y="228" font-size="12" fill="#5E584E">Co-founder, Nvidia</text>
<text x="380" y="198" font-size="22" fill="#5E584E">&amp;</text>
<text x="540" y="190" font-size="17" font-weight="700" fill="#0E0D0B">Michael Jordan</text>
<text x="540" y="210" font-size="12" fill="#5E584E">Brooklyn, New York</text>
<text x="540" y="228" font-size="12" fill="#5E584E">Six-time NBA champion</text>
<text x="380" y="258" font-size="12" fill="#5E584E">GOAT status: not settled here</text>
</g>
</svg>
