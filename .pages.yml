# Pages CMS setup for MODERNFLEX (https://app.pagescms.org).
# Sign in with GitHub, open this repository, and edit stories, episodes and settings in a form.

media:
  input: public/uploads
  output: /uploads

content:
  - name: stories
    label: Stories
    type: collection
    path: content/stories
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [title, section, date]
      sort: date
      order: desc
    fields:
      - { name: title, label: Headline, type: string, required: true }
      - name: section
        label: Section
        type: select
        required: true
        options:
          values: [Fashion, Music, Art, Photography, Culture, Pop culture, Technology & creativity]
      - name: format
        label: Format
        type: select
        options:
          values: [Article, Interview, Feature, Photo essay, Opinion]
      - name: location
        label: Location tag
        type: select
        options:
          values: [Worldwide, Bristol, London, UK, Europe, USA]
      - { name: date, label: Publish date, type: date, required: true }
      - { name: dek, label: Standfirst (one or two sentences under the headline), type: text, required: true }
      - { name: author, label: Words by, type: string }
      - { name: image, label: Main photo (leave empty to use a drawn plate), type: image }
      - { name: image_alt, label: Photo description for screen readers, type: string }
      - { name: image_credit, label: Photo credit, type: string }
      - name: plate
        label: Drawn plate (used only when there is no photo)
        type: select
        options:
          values: [vinyl, sneaker, figure, crowd, cranes, lens, blocks, wall, phone, bridge]
      - name: tone
        label: Plate colourway
        type: select
        options:
          values: [ink, cream, blue, bone]
      - { name: draft, label: Draft (hide from the site), type: boolean }
      - { name: sample, label: Sample content, type: boolean, hidden: true }
      - name: body
        label: Story
        type: rich-text
        options:
          format: markdown

  - name: episodes
    label: MFTV episodes
    type: collection
    path: content/episodes
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [title, series, date]
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: series
        label: Series
        type: select
        options:
          values: [Street Level, Backstage, In the Room, First Look]
      - { name: length, label: Running time (e.g. 12:40), type: string }
      - { name: location, label: Location, type: string }
      - { name: date, label: Release date, type: date, required: true }
      - { name: description, label: One-line description, type: text }
      - { name: youtube, label: YouTube link, type: string }
      - { name: image, label: Still frame (leave empty to use a drawn plate), type: image }
      - { name: image_alt, label: Still description, type: string }
      - name: plate
        label: Drawn plate
        type: select
        options:
          values: [vinyl, sneaker, figure, crowd, cranes, lens, blocks, wall, phone, bridge]
      - name: tone
        label: Plate colourway
        type: select
        options:
          values: [ink, cream, blue, bone]
      - { name: draft, label: Draft (hide from the site), type: boolean }
      - { name: sample, label: Sample content, type: boolean, hidden: true }

  - name: about
    label: About page
    type: file
    path: content/pages/about.md
    format: yaml-frontmatter
    fields:
      - { name: statement, label: Big statement, type: string }
      - { name: description, label: Search description, type: text }
      - name: body
        label: Story of MODERNFLEX
        type: rich-text
        options:
          format: markdown

  - name: settings
    label: Site settings and homepage
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: site
        label: Site
        type: object
        fields:
          - { name: url, label: Website address, type: string }
          - { name: email, label: Contact email, type: string }
          - { name: description, label: Search description, type: text }
          - { name: footer, label: Footer line, type: string }
          - { name: base, label: Footer location line, type: string }
          - { name: smallprint, label: Small print, type: string }
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string }
      - name: masthead
        label: Masthead lines
        type: object
        fields:
          - { name: left, type: string }
          - { name: right, type: string }
          - { name: signoff, type: string }
      - name: home
        label: Homepage picks (story file names, without .md)
        type: object
        fields:
          - { name: hero, label: Cover story, type: string }
          - { name: edit, label: The Edit (4 stories; the 3rd shows as a big quote), type: string, list: true }
          - { name: also, label: Also reading (3 stories), type: string, list: true }
      - name: editorial
        label: Editorial page
        type: object
        fields:
          - { name: intro, type: text }
      - name: mftv
        label: MFTV
        type: object
        fields:
          - { name: tagline, type: string }
          - { name: home_tagline, label: Homepage tagline, type: string }
          - name: series
            type: object
            list: true
            fields:
              - { name: name, type: string }
              - { name: text, type: string }
      - name: community
        label: Community
        type: object
        fields:
          - { name: intro, type: text }
          - { name: home_statement, label: Homepage statement, type: text }
          - { name: built_for, label: Homepage "Built for" line, type: string }
          - { name: who_for, label: Community page "Who it’s for" line, type: string }
          - name: open_now
            label: Open now
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: text, type: text }
              - { name: link, type: string }
              - { name: link_label, type: string }
          - name: in_development
            label: In development
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: text, type: text }
              - { name: link, type: string }
              - { name: link_label, type: string }
      - name: newsletter
        label: Newsletter
        type: object
        fields:
          - { name: tagline, type: string }
          - { name: pitch, type: text }
          - { name: action, label: Newsletter service form address (leave empty to collect emails in Netlify), type: string }
          - { name: field, label: Email field name your service expects, type: string }
      - name: contact_reasons
        label: Contact reasons
        type: object
        list: true
        fields:
          - { name: title, type: string }
          - { name: text, type: text }
